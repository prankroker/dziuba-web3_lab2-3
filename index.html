<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>DeFi Swap Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 30px; background: #f9f9fb; }
        .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto; }
        button { background: #0070f3; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:hover { background: #005bb5; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; }
        th { background: #f3f4f6; }
        .hash { font-family: monospace; font-size: 13px; color: #555; }
    </style>
</head>
<body>
<div class="card">
    <h2>DeFi Пул: Історія операцій (Full-stack Web3)</h2>
    <div id="authSection">
        <button id="connectBtn" onclick="connectWallet()">Підключити MetaMask</button>
    </div>
    <p id="accountDisplay" style="display:none;"></p>

    <h3>Ваші операції (дані з SQLite REST API)</h3>
    <button onclick="loadHistory()">Оновити історію</button>
    <table>
        <thead>
        <tr>
            <th>Блок</th>
            <th>Хеш транзакції</th>
            <th>Віддав (STK)</th>
            <th>Отримав (UAHc)</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        <tr><td colspan="4" style="text-align: center;">Підключіть гаманець для перегляду</td></tr>
        </tbody>
    </table>
</div>

<script>
    let currentAccount = null;

    async function connectWallet() {
        if (!window.ethereum) {
            alert("Встановіть MetaMask!");
            return;
        }
        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            currentAccount = accounts[0];

            document.getElementById("connectBtn").style.display = "none";
            const accDisplay = document.getElementById("accountDisplay");
            accDisplay.style.display = "block";
            accDisplay.innerHTML = `<strong>Підключений гаманець:</strong> ${currentAccount}`;

            await loadHistory();
        } catch (err) {
            console.error(err);
        }
    }

    async function loadHistory() {
        if (!currentAccount) return;
        try {
            const res = await fetch(`http://localhost:5000/api/swaps?trader=${currentAccount}`);
            const data = await res.json();
            const tbody = document.getElementById("tableBody");

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Записів ще немає. Зробіть обмін!</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
          <tr>
            <td>${item.blockNumber}</td>
            <td class="hash">${item.transactionHash}</td>
            <td><b>${parseFloat(item.amountIn).toFixed(4)}</b> STK</td>
            <td><b>${parseFloat(item.amountOut).toFixed(4)}</b> UAHc</td>
          </tr>
        `).join('');
        } catch (e) {
            console.error("Помилка отримання з бекенду:", e);
        }
    }
</script>
</body>
</html>
